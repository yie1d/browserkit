name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      commit: ${{ steps.release.outputs.commit }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check release identity
        id: release
        shell: bash
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::Release tag must be vMAJOR.MINOR.PATCH"
            exit 1
          }
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)
          tag="${GITHUB_REF_NAME#v}"
          test "$version" = "$tag" || {
            echo "::error::Cargo.toml version $version does not match tag $GITHUB_REF_NAME"
            exit 1
          }
          grep -F "## [$version] - " CHANGELOG.md >/dev/null || {
            echo "::error::CHANGELOG.md has no dated $version release section"
            exit 1
          }
          commit=$(git rev-list -n 1 "$GITHUB_REF_NAME")
          remote_commit=$(git ls-remote origin "refs/tags/$GITHUB_REF_NAME^{}" | awk 'NR == 1 {print $1}')
          if [ -z "$remote_commit" ]; then
            remote_commit=$(git ls-remote origin "refs/tags/$GITHUB_REF_NAME" | awk 'NR == 1 {print $1}')
          fi
          test "$remote_commit" = "$commit" || {
            echo "::error::Remote tag does not resolve to the checked-out commit"
            exit 1
          }
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$commit" origin/main || {
            echo "::error::Release commit is not part of origin/main"
            exit 1
          }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
      - run: cargo fmt --all -- --check
      - run: cargo test --all-targets --locked
      - run: cargo clippy --all-targets --locked -- -D warnings -A clippy::uninlined-format-args
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - run: cargo audit --deny warnings

      - name: Install Rust 1.88
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: 1.88.0
      - run: cargo +1.88.0 check --all-targets --locked

  licenses:
    name: Generate third-party licenses
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.88.0
      - name: Install cargo-about
        uses: taiki-e/install-action@07b4745e0c39a41822af610387492e3e53aa222b # v2
        with:
          tool: cargo-about@0.9.1
      - name: Generate license report
        run: cargo about generate --locked --fail about.hbs --output-file THIRD-PARTY-LICENSES.html
      - name: Upload legal notices
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: legal-notices
          path: |
            LICENSE
            THIRD-PARTY-LICENSES.html
          if-no-files-found: error
          retention-days: 1

  build:
    name: Build ${{ matrix.target }}
    needs: [validate, licenses]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: bk.exe
            archive: bk-windows-x86_64.zip

          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: bk
            archive: bk-linux-x86_64.tar.gz

          - os: macos-latest
            target: x86_64-apple-darwin
            binary: bk
            archive: bk-macos-x86_64.tar.gz

          - os: macos-latest
            target: aarch64-apple-darwin
            binary: bk
            archive: bk-macos-aarch64.tar.gz

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.88.0
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Download legal notices
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: legal-notices
          path: legal

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bin = "target/${{ matrix.target }}/release/${{ matrix.binary }}"
          New-Item -ItemType Directory -Path package
          Copy-Item $bin, legal/LICENSE, legal/THIRD-PARTY-LICENSES.html package/
          Compress-Archive -Path package/* -DestinationPath ${{ matrix.archive }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          bin="target/${{ matrix.target }}/release/${{ matrix.binary }}"
          mkdir package
          cp "$bin" legal/LICENSE legal/THIRD-PARTY-LICENSES.html package/
          tar -czf ${{ matrix.archive }} -C package .

      - name: Upload package artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish Rust SDK to crates.io
    needs: [validate, build]
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.validate.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.88.0

      - name: Revalidate immutable tag
        shell: bash
        env:
          RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
        run: |
          remote_commit=$(git ls-remote origin "refs/tags/$GITHUB_REF_NAME^{}" | awk 'NR == 1 {print $1}')
          if [ -z "$remote_commit" ]; then
            remote_commit=$(git ls-remote origin "refs/tags/$GITHUB_REF_NAME" | awk 'NR == 1 {print $1}')
          fi
          test "$remote_commit" = "$RELEASE_COMMIT"

      - name: Package and verify source provenance
        id: package
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
        run: |
          cargo package --locked
          crate="target/package/browserkit-$VERSION.crate"
          tar -tzf "$crate" | grep -F "browserkit-$VERSION/src/lib.rs" >/dev/null
          ! tar -tzf "$crate" | grep -F "browserkit-$VERSION/docs/REDESIGN.md" >/dev/null
          packaged_commit=$(tar -xOzf "$crate" "browserkit-$VERSION/.cargo_vcs_info.json" | jq -r '.git.sha1')
          test "$packaged_commit" = "$RELEASE_COMMIT"
          checksum=$(sha256sum "$crate" | awk '{print $1}')
          echo "checksum=$checksum" >> "$GITHUB_OUTPUT"

      - name: Check whether the exact crate version exists
        id: crate
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          status=$(curl --user-agent "browserkit-release/$VERSION (https://github.com/yie1d/browserkit)" \
            --silent --show-error --output /dev/null --write-out '%{http_code}' \
            "https://crates.io/api/v1/crates/browserkit/$VERSION")
          case "$status" in
            200) echo "published=true" >> "$GITHUB_OUTPUT" ;;
            404) echo "published=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::crates.io returned HTTP $status"; exit 1 ;;
          esac

      - name: Authenticate to crates.io
        id: auth
        if: steps.crate.outputs.published != 'true'
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish crate
        if: steps.crate.outputs.published != 'true'
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

      - name: Verify published checksum and VCS provenance
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
          LOCAL_CHECKSUM: ${{ steps.package.outputs.checksum }}
        run: |
          for attempt in $(seq 1 30); do
            status=$(curl --user-agent "browserkit-release/$VERSION (https://github.com/yie1d/browserkit)" \
              --silent --show-error --output crate-version.json --write-out '%{http_code}' \
              "https://crates.io/api/v1/crates/browserkit/$VERSION")
            [ "$status" = 200 ] && break
            [ "$status" = 404 ] || { echo "::error::crates.io returned HTTP $status"; exit 1; }
            sleep 10
          done
          test "$status" = 200
          checksum=$(jq -r '.version.checksum' crate-version.json)
          test "$checksum" = "$LOCAL_CHECKSUM" || {
            echo "::error::Published crate checksum differs from the locally verified package"
            exit 1
          }
          curl --user-agent "browserkit-release/$VERSION (https://github.com/yie1d/browserkit)" \
            --fail --location --silent --show-error \
            "https://crates.io/api/v1/crates/browserkit/$VERSION/download" \
            --output browserkit.crate
          echo "$LOCAL_CHECKSUM  browserkit.crate" | sha256sum --check --strict
          published_commit=$(tar -xOzf browserkit.crate \
            "browserkit-$VERSION/.cargo_vcs_info.json" | jq -r '.git.sha1')
          test "$published_commit" = "$RELEASE_COMMIT"

  release:
    name: Publish GitHub release
    needs: [validate, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.validate.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Revalidate immutable tag and prepare release notes
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
        run: |
          remote_commit=$(git ls-remote origin "refs/tags/$GITHUB_REF_NAME^{}" | awk 'NR == 1 {print $1}')
          if [ -z "$remote_commit" ]; then
            remote_commit=$(git ls-remote origin "refs/tags/$GITHUB_REF_NAME" | awk 'NR == 1 {print $1}')
          fi
          test "$remote_commit" = "$RELEASE_COMMIT"
          awk -v version="$VERSION" '
            index($0, "## [" version "] - ") == 1 { capture = 1; next }
            capture && /^## \[/ { exit }
            capture { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          test -s RELEASE_NOTES.md

      - name: Download release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          pattern: bk-*
          merge-multiple: true

      - name: Verify release artifacts
        shell: bash
        run: |
          expected=(
            bk-windows-x86_64.zip
            bk-linux-x86_64.tar.gz
            bk-macos-x86_64.tar.gz
            bk-macos-aarch64.tar.gz
          )
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq "${#expected[@]}"
          for archive in "${expected[@]}"; do
            test -f "dist/$archive"
          done
          (cd dist && sha256sum "${expected[@]}" > SHA256SUMS)

      - name: Create GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.ref_name }}
          target_commitish: ${{ needs.validate.outputs.commit }}
          body_path: RELEASE_NOTES.md
          files: dist/*
